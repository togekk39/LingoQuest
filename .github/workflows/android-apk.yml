name: Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Internal PR branches are already built by push; also build fork pull requests safely.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      ANDROID_ARCHITECTURES: arm64-v8a,armeabi-v7a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: npm ci
      - run: npm run packs:verify
      - run: npm run check
      - run: npm test
      - name: Build standalone preview APK
        run: node scripts/build-apk.mjs 2>&1 | tee apk-build.log
      - name: Verify APK signatures
        run: |
          for apk in work/apk/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
      - name: Upload installable APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: lingoquest-apk-${{ github.run_number }}-${{ github.sha }}
          path: work/apk/
          if-no-files-found: error
          retention-days: 30
      - name: Publish download instructions
        run: |
          {
            echo '## LingoQuest standalone APK'
            echo 'Download the artifact on this run, extract the ZIP, and install the .apk on an ARM Android 7+ device.'
            echo 'The release variant embeds the offline course, Hermes bundle and fonts; no Metro server or Expo account is needed.'
            echo '**Signing:** public template preview certificate. This is an installable testing build, not a private-key Play Store release.'
            echo 'SHA-256 and version/commit metadata are included beside the APK. Artifacts are kept for 30 days.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-diagnostics-${{ github.run_number }}
          path: |
            apk-build.log
            apps/mobile/android/app/build/outputs/logs/
            apps/mobile/android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
